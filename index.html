<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nizzlers Game Night - Party Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- GLOBAL STYLES & THEMING --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #070510, #161033, #0a192f);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.18);
            --accent-neon: #00ffcc;
            --accent-pink: #ff007f;
            --fire-gold: #ff9900;
            --text-main: #ffffff;
            --text-muted: #a0a0b8;
            --success: #00e676;
            --error: #ff1744;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; user-select: none; }

        body {
            background: var(--bg-gradient);
            background-size: 300% 300%;
            animation: gradientShift 14s ease infinite;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Top Bar User Status & Logout */
        #user-bar {
            position: fixed; top: 15px; right: 20px;
            display: none; align-items: center; gap: 12px;
            z-index: 10000; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
            padding: 8px 16px; border-radius: 30px; border: 1px solid var(--glass-border);
        }
        #user-bar .uname { font-weight: 700; color: var(--accent-neon); font-size: 0.9rem; }
        #user-bar .btn-logout { background: transparent; color: var(--error); border: none; font-size: 0.8rem; font-weight: 700; cursor: pointer; padding: 0; margin: 0; width: auto; box-shadow: none; text-transform: uppercase; }

        /* FX Canvas */
        #fx-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 999; }

        /* Toast Container */
        #toast-container {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; gap: 10px; z-index: 10001; pointer-events: none;
        }
        .toast {
            background: rgba(10, 10, 25, 0.95); backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 30px;
            padding: 12px 24px; color: #fff; font-weight: 600; font-size: 0.9rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            animation: slideInDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, fadeOut 0.4s ease 2.5s forwards;
        }
        .toast.success { border-left: 5px solid var(--success); }
        .toast.error { border-left: 5px solid var(--error); }
        .toast.fire { border-left: 5px solid var(--fire-gold); }

        @keyframes slideInDown { from { transform: translateY(-60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(-20px); } }

        /* Screen Architecture */
        .screen {
            display: none; flex-direction: column; align-items: center; justify-content: flex-start;
            height: 100%; width: 100%; padding: 40px 20px; overflow-y: auto;
            opacity: 0; transform: translateY(20px) scale(0.96);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .screen.active { display: flex; opacity: 1; transform: translateY(0) scale(1); }

        /* Glass Panel Modals */
        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 28px;
            padding: 30px; width: 100%; max-width: 440px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); margin-bottom: 20px; position: relative;
        }

        h1 { font-size: 2.3rem; font-weight: 800; text-align: center; margin-bottom: 8px; background: linear-gradient(to right, var(--accent-neon), var(--accent-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        h2 { font-size: 1.3rem; font-weight: 600; margin-bottom: 16px; text-align: center; color: #fff; }
        p { color: var(--text-muted); text-align: center; font-size: 0.92rem; margin-bottom: 20px; }

        /* Inputs & Buttons */
        .input-group { width: 100%; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.8rem; color: var(--accent-neon); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
        
        input[type="text"], input[type="password"] {
            width: 100%; padding: 16px; border-radius: 16px; border: 2px solid transparent;
            background: rgba(0,0,0,0.45); color: #fff; font-size: 1.05rem;
            outline: none; transition: all 0.3s ease; box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
            text-align: center;
        }
        input:focus { border-color: var(--accent-neon); background: rgba(0,0,0,0.65); }

        button {
            width: 100%; padding: 16px; border-radius: 16px; border: none;
            background: linear-gradient(45deg, var(--accent-neon), #00b3ff);
            color: #000; font-size: 1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: transform 0.15s, box-shadow 0.3s;
            box-shadow: 0 10px 25px rgba(0, 255, 204, 0.25); margin-bottom: 12px;
        }
        button:active { transform: translateY(3px) scale(0.98); }
        button.pink { background: linear-gradient(45deg, var(--accent-pink), #ff5500); color: #fff; box-shadow: 0 10px 25px rgba(255, 0, 127, 0.3); }
        button.secondary { background: rgba(255,255,255,0.08); color: #fff; box-shadow: none; border: 1px solid var(--glass-border); }
        button:disabled { background: #222 !important; color: #666 !important; cursor: not-allowed; box-shadow: none !important; transform: none !important; }

        /* Party Code Display Box */
        .code-display {
            background: rgba(0,0,0,0.6); border: 2px dashed var(--accent-neon);
            border-radius: 20px; padding: 15px; text-align: center; margin-bottom: 20px;
        }
        .code-display .code-title { font-size: 0.8rem; color: var(--text-muted); letter-spacing: 2px; }
        .code-display .code-value { font-size: 2.2rem; font-weight: 800; color: var(--accent-neon); letter-spacing: 6px; }

        /* --- FLOATING PROFILES ARENA --- */
        #floating-arena {
            width: 100%; height: 260px; background: rgba(0,0,0,0.4);
            border-radius: 20px; border: 1px solid var(--glass-border);
            position: relative; overflow: hidden; margin-bottom: 20px;
        }

        .profile-bubble {
            position: absolute; width: 85px; height: 85px;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
            backdrop-filter: blur(10px); border: 2px solid var(--accent-neon);
            border-radius: 50%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: #fff;
            cursor: grab; touch-action: none; box-shadow: 0 8px 20px rgba(0,255,204,0.2);
            animation: floatBob 3s ease-in-out infinite alternate;
        }
        .profile-bubble:active { cursor: grabbing; border-color: var(--accent-pink); }
        .profile-bubble .p-avatar { font-size: 1.5rem; }
        .profile-bubble .p-name { font-size: 0.75rem; font-weight: 700; max-width: 75px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        @keyframes floatBob {
            0% { transform: translateY(0px) rotate(-2deg); }
            100% { transform: translateY(-12px) rotate(2deg); }
        }

        /* Leaderboard List */
        .list-container { width: 100%; max-height: 45vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: rgba(0,0,0,0.35); border-radius: 16px; border: 1px solid var(--glass-border); }
        .list-item .name-box { display: flex; align-items: center; gap: 10px; font-weight: 600; }
        .exp-tag { background: var(--accent-neon); color: #000; padding: 3px 10px; border-radius: 12px; font-weight: 800; font-size: 0.85rem; }

        .loader { border: 4px solid var(--glass-border); border-top: 4px solid var(--accent-neon); border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="user-bar">
        <span class="uname" id="bar-username">User</span>
        <button class="btn-logout" id="btn-logout">Log Out</button>
    </div>

    <canvas id="fx-canvas"></canvas>
    <div id="toast-container"></div>

    <div id="screen-auth" class="screen active">
        <div class="glass-panel" style="margin-top: 50px;">
            <h1>Nizzlers</h1>
            <p>Enter your profile details to stay signed in</p>
            
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="auth-user" placeholder="e.g. Lilo, Lana, Owen..." autocomplete="off">
            </div>

            <div class="input-group">
                <label>Password / PIN</label>
                <input type="password" id="auth-pass" placeholder="••••••••">
            </div>

            <button id="btn-auth-submit">Sign In / Register</button>
        </div>
    </div>

    <div id="screen-mode" class="screen">
        <div class="glass-panel">
            <h1>Game Night</h1>
            <p>Create a party room or enter a code to join</p>

            <button id="btn-mode-create" class="pink">🎮 Create New Game</button>
            
            <div style="margin: 20px 0; border-top: 1px solid var(--glass-border);"></div>

            <div class="input-group">
                <label>Join Game Code</label>
                <input type="text" id="join-code-input" placeholder="e.g. 582914" maxlength="6" style="letter-spacing: 4px; font-weight: 800;">
            </div>
            <button id="btn-mode-join">🚀 Join Game Code</button>
        </div>
    </div>

    <div id="screen-lobby" class="screen">
        <div class="glass-panel">
            <h2>Party Lobby</h2>
            
            <div class="code-display">
                <div class="code-title">PARTY CODE</div>
                <div class="code-value" id="party-code-tag">------</div>
            </div>

            <p id="lobby-count-text">Waiting for players (0 / 3 min)...</p>

            <div id="floating-arena">
                </div>

            <button id="btn-start-game" class="pink" disabled>Start Game Anyway (Need 3 Players)</button>
        </div>
    </div>

    <div id="screen-player" class="screen">
        <div class="glass-panel">
            <h2 id="display-q" style="min-height: 70px; display: flex; align-items: center; justify-content: center;">Waiting for host to deploy question...</h2>
        </div>

        <div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px;">
            <button id="btn-opt-a" class="answer-btn" onclick="submitAnswer('A')" disabled>Option A</button>
            <button id="btn-opt-b" class="answer-btn" onclick="submitAnswer('B')" disabled>Option B</button>
        </div>

        <div id="host-game-controls" style="display:none; width: 100%; max-width: 440px; margin-top: 20px;">
            <button id="btn-host-next-q" class="pink">Push Next Question</button>
            <button id="btn-host-end-round" class="secondary" style="border-color: var(--error); color: var(--error);">End Round & Award EXP</button>
        </div>

        <button class="secondary nav-to-leaderboard" style="max-width: 440px; margin-top: 20px;">View Leaderboard</button>
    </div>

    <div id="screen-leaderboard" class="screen">
        <div class="glass-panel" style="max-height: 80vh; display: flex; flex-direction: column;">
            <h1>Leaderboard</h1>
            <div class="list-container" id="leaderboard-list" style="flex-grow: 1;">
                </div>
            <button id="btn-back-game" style="margin-top: 15px;">Return to Game</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, getDoc, collection, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCoxu99FykhoDnyZiVkPaSS2cC03KmG9b0",
            authDomain: "nizzlers-92be3.firebaseapp.com",
            projectId: "nizzlers-92be3",
            storageBucket: "nizzlers-92be3.firebasestorage.app",
            messagingSenderId: "594175328017",
            appId: "1:594175328017:web:b9b92535f3d752961756b0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // State Variables
        let myPlayerId = localStorage.getItem('nizzler_id');
        let myUsername = localStorage.getItem('nizzler_name');
        let currentPartyCode = localStorage.getItem('nizzler_party_code');
        let isHost = false;

        // --- SCREEN NAVIGATION & UTILS ---
        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            setTimeout(() => document.getElementById(id).classList.add('active'), 50);
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2800);
        }

        // --- PERSISTENT AUTHENTICATION ENGINE ---
        function checkPersistentAuth() {
            if (myPlayerId && myUsername) {
                document.getElementById('user-bar').style.display = 'flex';
                document.getElementById('bar-username').innerText = myUsername;
                switchScreen('screen-mode');
            } else {
                document.getElementById('user-bar').style.display = 'none';
                switchScreen('screen-auth');
            }
        }

        document.getElementById('btn-auth-submit').addEventListener('click', async () => {
            const u = document.getElementById('auth-user').value.trim();
            const p = document.getElementById('auth-pass').value.trim();
            if (!u || !p) return showToast("Enter username and password!", "error");

            myUsername = u;
            myPlayerId = 'usr_' + u.toLowerCase().replace(/\s+/g, '');

            const pRef = doc(db, "users", myPlayerId);
            const pSnap = await getDoc(pRef);

            if (!pSnap.exists()) {
                await setDoc(pRef, { name: u, pass: p, createdAt: Date.now() });
            } else if (pSnap.data().pass !== p) {
                return showToast("Incorrect password for this user!", "error");
            }

            localStorage.setItem('nizzler_id', myPlayerId);
            localStorage.setItem('nizzler_name', myUsername);

            checkPersistentAuth();
            showToast(`Logged in as ${myUsername}!`, "success");
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            localStorage.clear();
            myPlayerId = null; myUsername = null; currentPartyCode = null;
            checkPersistentAuth();
            showToast("Logged out successfully.", "info");
        });

        // --- PARTY CODE ENGINE ---
        function generatePartyCode() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        // CREATE GAME ROOM
        document.getElementById('btn-mode-create').addEventListener('click', async () => {
            currentPartyCode = generatePartyCode();
            isHost = true;
            localStorage.setItem('nizzler_party_code', currentPartyCode);

            // Create Party Doc
            await setDoc(doc(db, "parties", currentPartyCode), {
                hostId: myPlayerId,
                status: 'lobby',
                created: Date.now(),
                question: "", optA: "", optB: "", correct: "A"
            });

            // Join Party as Host Player
            await setDoc(doc(db, "parties", currentPartyCode, "players", myPlayerId), {
                name: myUsername, exp: 0, lastAnswer: "", isHost: true, x: 20, y: 20
            });

            setupPartyListeners();
            switchScreen('screen-lobby');
            showToast(`Party Room ${currentPartyCode} Created!`, "success");
        });

        // JOIN GAME ROOM
        document.getElementById('btn-mode-join').addEventListener('click', async () => {
            const code = document.getElementById('join-code-input').value.trim();
            if (code.length !== 6) return showToast("Enter valid 6-digit code!", "error");

            const partyRef = doc(db, "parties", code);
            const partySnap = await getDoc(partyRef);

            if (!partySnap.exists()) return showToast("Party code not found!", "error");

            currentPartyCode = code;
            isHost = false;
            localStorage.setItem('nizzler_party_code', currentPartyCode);

            // Join Party as Player
            await setDoc(doc(db, "parties", currentPartyCode, "players", myPlayerId), {
                name: myUsername, exp: 0, lastAnswer: "", isHost: false, x: Math.random()*150, y: Math.random()*100
            });

            setupPartyListeners();
            switchScreen('screen-lobby');
            showToast(`Joined Party ${currentPartyCode}!`, "success");
        });

        // --- REALTIME LOBBY & FLOATING BUBBLES ENGINE ---
        function setupPartyListeners() {
            if (!currentPartyCode) return;
            document.getElementById('party-code-tag').innerText = currentPartyCode;

            // Listen to Players & Render Floating Bubbles
            onSnapshot(collection(db, "parties", currentPartyCode, "players"), (snapshot) => {
                const players = [];
                const arena = document.getElementById('floating-arena');
                arena.innerHTML = ''; // Re-render bubbles

                snapshot.forEach(d => {
                    const p = d.data();
                    players.push(p);

                    // Create Floating Bubble
                    const bubble = document.createElement('div');
                    bubble.className = 'profile-bubble';
                    bubble.style.left = `${p.x || 20}px`;
                    bubble.style.top = `${p.y || 20}px`;
                    bubble.innerHTML = `
                        <div class="p-avatar">${p.isHost ? '👑' : '🎮'}</div>
                        <div class="p-name">${p.name}</div>
                    `;

                    // Drag & Drop Functionality for Host
                    if (isHost) {
                        makeBubbleDraggable(bubble, d.id);
                    }

                    arena.appendChild(bubble);
                });

                // Update Player Count & Start Game Button Rule (Min 3 players)
                const countText = document.getElementById('lobby-count-text');
                const startBtn = document.getElementById('btn-start-game');

                countText.innerText = `Players Joined: (${players.length} / 3 min)`;

                if (isHost) {
                    startBtn.style.display = 'block';
                    if (players.length >= 3) {
                        startBtn.disabled = false;
                        startBtn.innerText = "🚀 Start Game Anyway";
                    } else {
                        startBtn.disabled = true;
                        startBtn.innerText = `Start Game Anyway (Need ${3 - players.length} More)`;
                    }
                } else {
                    startBtn.style.display = 'none';
                }

                // Render Leaderboard List
                players.sort((a, b) => b.exp - a.exp);
                document.getElementById('leaderboard-list').innerHTML = players.map((p, i) => `
                    <div class="list-item">
                        <div class="name-box">${i === 0 ? '👑' : i + 1 + '.'} ${p.name}</div>
                        <div class="exp-tag">${p.exp} XP</div>
                    </div>
                `).join('');
            });

            // Listen to Game Room State
            onSnapshot(doc(db, "parties", currentPartyCode), (snap) => {
                if (!snap.exists()) return;
                const data = snap.data();

                if (data.status === 'active') {
                    switchScreen('screen-player');
                    document.getElementById('display-q').innerText = data.question || "Round Started!";
                    document.getElementById('btn-opt-a').innerText = data.optA || "Option A";
                    document.getElementById('btn-opt-b').innerText = data.optB || "Option B";
                    
                    const a = document.getElementById('btn-opt-a');
                    const b = document.getElementById('btn-opt-b');
                    a.disabled = false; b.disabled = false;
                    a.style.opacity = '1'; b.style.opacity = '1';

                    if (isHost) document.getElementById('host-game-controls').style.display = 'block';
                }
            });
        }

        // --- DRAG BUBBLE LOGIC ---
        function makeBubbleDraggable(element, playerId) {
            let active = false, currentX, currentY, initialX, initialY;

            element.addEventListener('mousedown', dragStart);
            element.addEventListener('touchstart', dragStart, { passive: true });

            function dragStart(e) {
                if (e.type === "touchstart") {
                    initialX = e.touches[0].clientX - element.offsetLeft;
                    initialY = e.touches[0].clientY - element.offsetTop;
                } else {
                    initialX = e.clientX - element.offsetLeft;
                    initialY = e.clientY - element.offsetTop;
                }
                active = true;
                window.addEventListener('mousemove', drag);
                window.addEventListener('touchmove', drag, { passive: true });
                window.addEventListener('mouseup', dragEnd);
                window.addEventListener('touchend', dragEnd);
            }

            function drag(e) {
                if (!active) return;
                if (e.type === "touchmove") {
                    currentX = e.touches[0].clientX - initialX;
                    currentY = e.touches[0].clientY - initialY;
                } else {
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;
                }
                element.style.left = `${currentX}px`;
                element.style.top = `${currentY}px`;
            }

            function dragEnd() {
                active = false;
                window.removeEventListener('mousemove', drag);
                window.removeEventListener('touchmove', drag);
                window.removeEventListener('mouseup', dragEnd);
                window.removeEventListener('touchend', dragEnd);

                // Save new position to Firestore
                updateDoc(doc(db, "parties", currentPartyCode, "players", playerId), {
                    x: currentX, y: currentY
                });
            }
        }

        // --- HOST GAME CONTROLS ---
        document.getElementById('btn-start-game').addEventListener('click', async () => {
            await updateDoc(doc(db, "parties", currentPartyCode), {
                status: 'active',
                question: 'Who is most likely to win this game?',
                optA: 'Option A', optB: 'Option B'
            });
        });

        window.submitAnswer = async function(choice) {
            document.getElementById('btn-opt-a').disabled = true;
            document.getElementById('btn-opt-b').disabled = true;
            if (choice === 'A') document.getElementById('btn-opt-b').style.opacity = '0.3';
            if (choice === 'B') document.getElementById('btn-opt-a').style.opacity = '0.3';

            await updateDoc(doc(db, "parties", currentPartyCode, "players", myPlayerId), { lastAnswer: choice });
            showToast("Answer locked!", "success");
        };

        // Navigation
        document.querySelectorAll('.nav-to-leaderboard').forEach(b => b.addEventListener('click', () => switchScreen('screen-leaderboard')));
        document.getElementById('btn-back-game').addEventListener('click', () => switchScreen('screen-player'));

        // Boot
        checkPersistentAuth();
    </script>
</body>
</html>
