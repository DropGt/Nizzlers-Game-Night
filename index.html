<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nizzlers Game Night - Ping & PFP Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- GLOBAL STYLES & THEMING --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #070510, #161033, #0a192f);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.18);
            --accent-neon: #00ffcc;
            --accent-pink: #ff007f;
            --fire-gold: #ff9900;
            --text-main: #ffffff;
            --text-muted: #a0a0b8;
            --success: #00e676;
            --error: #ff1744;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; user-select: none; }

        body {
            background: var(--bg-gradient);
            background-size: 300% 300%;
            animation: gradientShift 14s ease infinite;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Top Bar User Status & Logout */
        #user-bar {
            position: fixed; top: 15px; right: 20px;
            display: none; align-items: center; gap: 10px;
            z-index: 10000; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            padding: 6px 14px; border-radius: 30px; border: 1px solid var(--glass-border);
        }
        #user-bar .uname { font-weight: 700; color: var(--accent-neon); font-size: 0.85rem; }
        
        /* Ping Badge */
        .ping-badge {
            background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
            border-radius: 12px; padding: 2px 8px; font-size: 0.72rem; font-weight: 800; color: var(--success);
            display: flex; align-items: center; gap: 4px;
        }
        .ping-badge.laggy { color: var(--fire-gold); border-color: var(--fire-gold); }
        .ping-badge.bad { color: var(--error); border-color: var(--error); }

        #user-bar .btn-logout { background: transparent; color: var(--error); border: none; font-size: 0.8rem; font-weight: 700; cursor: pointer; padding: 0; margin: 0; width: auto; box-shadow: none; text-transform: uppercase; }

        /* Small Avatar Bar Image */
        .bar-pfp { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--accent-neon); }

        /* Toast Container */
        #toast-container {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; gap: 10px; z-index: 10001; pointer-events: none;
        }
        .toast {
            background: rgba(10, 10, 25, 0.95); backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 30px;
            padding: 12px 24px; color: #fff; font-weight: 600; font-size: 0.88rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            animation: slideInDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, fadeOut 0.4s ease 3s forwards;
        }
        .toast.success { border-left: 5px solid var(--success); }
        .toast.error { border-left: 5px solid var(--error); }
        .toast.warning { border-left: 5px solid var(--fire-gold); }

        @keyframes slideInDown { from { transform: translateY(-60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(-20px); } }

        /* Screen Architecture */
        .screen {
            display: none; flex-direction: column; align-items: center; justify-content: flex-start;
            height: 100%; width: 100%; padding: 40px 20px; overflow-y: auto;
            opacity: 0; transform: translateY(20px) scale(0.96);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .screen.active { display: flex; opacity: 1; transform: translateY(0) scale(1); }

        /* Glass Panel Modals */
        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 28px;
            padding: 26px; width: 100%; max-width: 440px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); margin-bottom: 20px; position: relative;
        }

        h1 { font-size: 2.2rem; font-weight: 800; text-align: center; margin-bottom: 6px; background: linear-gradient(to right, var(--accent-neon), var(--accent-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 14px; text-align: center; color: #fff; }
        p { color: var(--text-muted); text-align: center; font-size: 0.9rem; margin-bottom: 18px; }

        /* Inputs & Buttons */
        .input-group { width: 100%; margin-bottom: 12px; }
        .input-group label { display: block; font-size: 0.78rem; color: var(--accent-neon); margin-bottom: 5px; font-weight: 600; text-transform: uppercase; }
        
        input[type="text"], input[type="password"] {
            width: 100%; padding: 14px; border-radius: 16px; border: 2px solid transparent;
            background: rgba(0,0,0,0.45); color: #fff; font-size: 1rem;
            outline: none; transition: all 0.3s ease; box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
            text-align: center;
        }
        input:focus { border-color: var(--accent-neon); background: rgba(0,0,0,0.65); }

        button {
            width: 100%; padding: 15px; border-radius: 16px; border: none;
            background: linear-gradient(45deg, var(--accent-neon), #00b3ff);
            color: #000; font-size: 0.95rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: transform 0.15s, box-shadow 0.3s;
            box-shadow: 0 10px 25px rgba(0, 255, 204, 0.25); margin-bottom: 10px;
        }
        button:active { transform: translateY(3px) scale(0.98); }
        button.pink { background: linear-gradient(45deg, var(--accent-pink), #ff5500); color: #fff; box-shadow: 0 10px 25px rgba(255, 0, 127, 0.3); }
        button.rejoin-btn { background: linear-gradient(45deg, #00e676, #00b0ff); color: #000; box-shadow: 0 10px 25px rgba(0, 230, 118, 0.3); }
        button.secondary { background: rgba(255,255,255,0.08); color: #fff; box-shadow: none; border: 1px solid var(--glass-border); }
        button:disabled { background: #222 !important; color: #666 !important; cursor: not-allowed; box-shadow: none !important; transform: none !important; }

        /* Party Code Display Box */
        .code-display {
            background: rgba(0,0,0,0.6); border: 2px dashed var(--accent-neon);
            border-radius: 20px; padding: 12px; text-align: center; margin-bottom: 16px;
        }
        .code-display .code-title { font-size: 0.75rem; color: var(--text-muted); letter-spacing: 2px; }
        .code-display .code-value { font-size: 2rem; font-weight: 800; color: var(--accent-neon); letter-spacing: 6px; }

        /* --- FLOATING PROFILES ARENA & DISCONNECTED STATUS --- */
        #floating-arena {
            width: 100%; height: 270px; background: rgba(0,0,0,0.4);
            border-radius: 20px; border: 1px solid var(--glass-border);
            position: relative; overflow: hidden; margin-bottom: 16px;
        }

        .profile-bubble {
            position: absolute; width: 88px; height: 88px;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
            backdrop-filter: blur(10px); border: 2.5px solid var(--accent-neon);
            border-radius: 50%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: #fff;
            cursor: grab; touch-action: none; box-shadow: 0 8px 20px rgba(0,255,204,0.2);
            animation: floatBob 3s ease-in-out infinite alternate;
            transition: border-color 0.3s, opacity 0.3s;
        }
        .profile-bubble.offline {
            border-color: var(--error) !important;
            opacity: 0.6;
            filter: grayscale(0.7);
        }
        .profile-bubble:active { cursor: grabbing; border-color: var(--accent-pink); }
        
        .profile-bubble .p-avatar-img {
            width: 44px; height: 44px; border-radius: 50%; object-fit: cover; margin-bottom: 2px;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .profile-bubble .p-avatar-emoji { font-size: 1.5rem; }
        .profile-bubble .p-name { font-size: 0.7rem; font-weight: 700; max-width: 75px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Disconnected Status Tag */
        .status-tag {
            position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
            background: var(--error); color: #fff; font-size: 0.6rem; font-weight: 800;
            padding: 2px 8px; border-radius: 10px; white-space: nowrap; box-shadow: 0 4px 10px rgba(255,23,68,0.5);
        }

        @keyframes floatBob {
            0% { transform: translateY(0px) rotate(-2deg); }
            100% { transform: translateY(-12px) rotate(2deg); }
        }

        /* --- CAMERA & PFP SELECTOR --- */
        .pfp-preview-container {
            display: flex; flex-direction: column; align-items: center; margin-bottom: 15px;
        }
        #pfp-preview {
            width: 90px; height: 90px; border-radius: 50%; object-fit: cover;
            border: 3px solid var(--accent-neon); box-shadow: 0 0 20px rgba(0,255,204,0.4);
            margin-bottom: 10px; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem;
        }
        #camera-video { width: 100%; border-radius: 16px; margin-bottom: 10px; display: none; background: #000; }
        #canvas-capture { display: none; }

        /* Leaderboard List */
        .list-container { width: 100%; max-height: 45vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(0,0,0,0.35); border-radius: 16px; border: 1px solid var(--glass-border); }
        .list-item .name-box { display: flex; align-items: center; gap: 10px; font-weight: 600; }
        .list-item .list-pfp { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .exp-tag { background: var(--accent-neon); color: #000; padding: 3px 10px; border-radius: 12px; font-weight: 800; font-size: 0.82rem; }
    </style>
</head>
<body>

    <div id="user-bar">
        <img id="bar-pfp-img" class="bar-pfp" src="" style="display:none;">
        <span class="uname" id="bar-username">User</span>
        <div id="ping-display" class="ping-badge">--ms 📶</div>
        <button class="btn-logout" id="btn-logout">Log Out</button>
    </div>

    <div id="toast-container"></div>

    <div id="screen-auth" class="screen active">
        <div class="glass-panel" style="margin-top: 20px;">
            <h1>Nizzlers</h1>
            <p>Create your profile & take a picture</p>
            
            <div class="pfp-preview-container">
                <div id="pfp-preview">👤</div>
                <video id="camera-video" autoplay playsinline></video>
                <canvas id="canvas-capture" width="200" height="200"></canvas>
                
                <div style="display: flex; gap: 8px; width: 100%;">
                    <button id="btn-take-photo" class="secondary" style="font-size:0.75rem; padding: 10px;">📸 Take Snap</button>
                    <button id="btn-snap-confirm" class="pink" style="display:none; font-size:0.75rem; padding: 10px;">Capture!</button>
                    <button id="btn-upload-file" class="secondary" style="font-size:0.75rem; padding: 10px;">📁 Upload</button>
                    <input type="file" id="pfp-file-input" accept="image/*" style="display:none;">
                </div>
            </div>

            <div class="input-group">
                <label>Username</label>
                <input type="text" id="auth-user" placeholder="e.g. Lilo, Lana, Owen..." autocomplete="off">
            </div>

            <div class="input-group">
                <label>Password / PIN</label>
                <input type="password" id="auth-pass" placeholder="••••••••">
            </div>

            <button id="btn-auth-submit">Sign In / Register</button>
        </div>
    </div>

    <div id="screen-mode" class="screen">
        <div class="glass-panel">
            <h1>Game Night</h1>
            <p>Create room, enter code, or rejoin</p>

            <button id="btn-rejoin-party" class="rejoin-btn" style="display: none;">↩️ Rejoin Party (<span id="rejoin-code-text">------</span>)</button>
            <button id="btn-mode-create" class="pink">🎮 Create New Game</button>
            
            <div style="margin: 16px 0; border-top: 1px solid var(--glass-border);"></div>

            <div class="input-group">
                <label>Join Game Code</label>
                <input type="text" id="join-code-input" placeholder="e.g. 582914" maxlength="6" style="letter-spacing: 4px; font-weight: 800;">
            </div>
            <button id="btn-mode-join">🚀 Join Game Code</button>
        </div>
    </div>

    <div id="screen-lobby" class="screen">
        <div class="glass-panel">
            <h2>Party Lobby</h2>
            
            <div class="code-display">
                <div class="code-title">PARTY CODE</div>
                <div class="code-value" id="party-code-tag">------</div>
            </div>

            <p id="lobby-count-text">Waiting for players (0 / 3 min)...</p>

            <div id="floating-arena"></div>

            <button id="btn-start-game" class="pink" disabled>Start Game Anyway (Need 3 Players)</button>
            <button id="btn-leave-party" class="secondary" style="border-color: var(--error); color: var(--error);">Leave Party Room</button>
        </div>
    </div>

    <div id="screen-player" class="screen">
        <div class="glass-panel">
            <h2 id="display-q" style="min-height: 70px; display: flex; align-items: center; justify-content: center;">Waiting for host to deploy question...</h2>
        </div>

        <div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px;">
            <button id="btn-opt-a" class="answer-btn" onclick="submitAnswer('A')" disabled>Option A</button>
            <button id="btn-opt-b" class="answer-btn" onclick="submitAnswer('B')" disabled>Option B</button>
        </div>

        <div id="host-game-controls" style="display:none; width: 100%; max-width: 440px; margin-top: 20px;">
            <button id="btn-host-next-q" class="pink">Push Next Question</button>
            <button id="btn-host-end-round" class="secondary" style="border-color: var(--error); color: var(--error);">End Round & Award EXP</button>
        </div>

        <button class="secondary nav-to-leaderboard" style="max-width: 440px; margin-top: 20px;">View Leaderboard</button>
    </div>

    <div id="screen-leaderboard" class="screen">
        <div class="glass-panel" style="max-height: 80vh; display: flex; flex-direction: column;">
            <h1>Leaderboard</h1>
            <div class="list-container" id="leaderboard-list" style="flex-grow: 1;"></div>
            <button id="btn-back-game" style="margin-top: 15px;">Return to Game</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, getDoc, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCoxu99FykhoDnyZiVkPaSS2cC03KmG9b0",
            authDomain: "nizzlers-92be3.firebaseapp.com",
            projectId: "nizzlers-92be3",
            storageBucket: "nizzlers-92be3.firebasestorage.app",
            messagingSenderId: "594175328017",
            appId: "1:594175328017:web:b9b92535f3d752961756b0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // State Variables
        let myPlayerId = localStorage.getItem('nizzler_id');
        let myUsername = localStorage.getItem('nizzler_name');
        let myPfpBase64 = localStorage.getItem('nizzler_pfp') || '';
        let currentPartyCode = localStorage.getItem('nizzler_party_code');
        let isHost = false;
        let unsubscribeParty = null;
        let unsubscribePlayers = null;
        let cameraStream = null;
        let badWifiNotified = {};

        // Screen Navigation & Toast
        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            setTimeout(() => document.getElementById(id).classList.add('active'), 50);
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3200);
        }

        // --- CAMERA & PFP LOGIC ---
        const btnTakePhoto = document.getElementById('btn-take-photo');
        const btnSnapConfirm = document.getElementById('btn-snap-confirm');
        const btnUploadFile = document.getElementById('btn-upload-file');
        const pfpFileInput = document.getElementById('pfp-file-input');
        const cameraVideo = document.getElementById('camera-video');
        const canvasCapture = document.getElementById('canvas-capture');
        const pfpPreview = document.getElementById('pfp-preview');

        if (myPfpBase64) {
            pfpPreview.innerHTML = `<img src="${myPfpBase64}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
        }

        btnTakePhoto.addEventListener('click', async () => {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                cameraVideo.srcObject = cameraStream;
                cameraVideo.style.display = 'block';
                pfpPreview.style.display = 'none';
                btnTakePhoto.style.display = 'none';
                btnSnapConfirm.style.display = 'block';
            } catch(err) {
                showToast("Unable to access camera!", "error");
            }
        });

        btnSnapConfirm.addEventListener('click', () => {
            const ctx = canvasCapture.getContext('2d');
            ctx.drawImage(cameraVideo, 0, 0, 200, 200);
            myPfpBase64 = canvasCapture.toDataURL('image/jpeg', 0.8);
            
            // Stop Camera
            if (cameraStream) cameraStream.getTracks().forEach(track => track.stop());
            cameraVideo.style.display = 'none';
            pfpPreview.style.display = 'flex';
            pfpPreview.innerHTML = `<img src="${myPfpBase64}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
            
            btnTakePhoto.style.display = 'block';
            btnSnapConfirm.style.display = 'none';
            localStorage.setItem('nizzler_pfp', myPfpBase64);
            showToast("Profile Photo captured!", "success");
        });

        btnUploadFile.addEventListener('click', () => pfpFileInput.click());
        pfpFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    myPfpBase64 = evt.target.result;
                    pfpPreview.innerHTML = `<img src="${myPfpBase64}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                    localStorage.setItem('nizzler_pfp', myPfpBase64);
                    showToast("Photo uploaded successfully!", "success");
                };
                reader.readAsDataURL(file);
            }
        });

        // --- PING TESTER & HEARTBEAT ENGINE ---
        let currentPing = 0;
        setInterval(async () => {
            if (!myPlayerId) return;
            const start = Date.now();
            try {
                // Ping test check against Firestore timestamp
                await getDoc(doc(db, "users", myPlayerId));
                currentPing = Date.now() - start;

                // Update UI Ping Tester Badge
                const badge = document.getElementById('ping-display');
                badge.innerText = `${currentPing}ms 📶`;
                badge.className = 'ping-badge';
                if (currentPing > 150 && currentPing <= 300) badge.classList.add('laggy');
                if (currentPing > 300) badge.classList.add('bad');

                // If inside a party, update online heartbeat & current ping
                if (currentPartyCode) {
                    updateDoc(doc(db, "parties", currentPartyCode, "players", myPlayerId), {
                        lastSeen: Date.now(),
                        ping: currentPing
                    }).catch(()=>{});
                }
            } catch(e) {}
        }, 3500);

        // --- AUTH CHECK ---
        async function checkPersistentAuth() {
            if (myPlayerId && myUsername) {
                document.getElementById('user-bar').style.display = 'flex';
                document.getElementById('bar-username').innerText = myUsername;
                if (myPfpBase64) {
                    const img = document.getElementById('bar-pfp-img');
                    img.src = myPfpBase64; img.style.display = 'block';
                }
                
                if (currentPartyCode) {
                    const partySnap = await getDoc(doc(db, "parties", currentPartyCode));
                    if (partySnap.exists()) {
                        document.getElementById('rejoin-code-text').innerText = currentPartyCode;
                        document.getElementById('btn-rejoin-party').style.display = 'block';
                    } else {
                        localStorage.removeItem('nizzler_party_code'); currentPartyCode = null;
                    }
                }
                switchScreen('screen-mode');
            } else {
                document.getElementById('user-bar').style.display = 'none';
                switchScreen('screen-auth');
            }
        }

        document.getElementById('btn-auth-submit').addEventListener('click', async () => {
            const u = document.getElementById('auth-user').value.trim();
            const p = document.getElementById('auth-pass').value.trim();
            if (!u || !p) return showToast("Enter username and password!", "error");

            myUsername = u;
            myPlayerId = 'usr_' + u.toLowerCase().replace(/\s+/g, '');

            const pRef = doc(db, "users", myPlayerId);
            const pSnap = await getDoc(pRef);

            if (!pSnap.exists()) {
                await setDoc(pRef, { name: u, pass: p, pfp: myPfpBase64, createdAt: Date.now() });
            } else if (pSnap.data().pass !== p) {
                return showToast("Incorrect password!", "error");
            } else {
                await updateDoc(pRef, { pfp: myPfpBase64 });
            }

            localStorage.setItem('nizzler_id', myPlayerId);
            localStorage.setItem('nizzler_name', myUsername);

            checkPersistentAuth();
            showToast(`Logged in as ${myUsername}!`, "success");
        });

        document.getElementById('btn-logout').addEventListener('click', async () => {
            await leaveCurrentParty();
            localStorage.clear();
            myPlayerId = null; myUsername = null; currentPartyCode = null; myPfpBase64 = '';
            checkPersistentAuth();
            showToast("Logged out successfully.", "info");
        });

        // REJOIN PARTY HANDLER
        document.getElementById('btn-rejoin-party').addEventListener('click', async () => {
            if (!currentPartyCode) return;
            const partySnap = await getDoc(doc(db, "parties", currentPartyCode));
            if (!partySnap.exists()) return showToast("Party no longer exists!", "error");

            const partyData = partySnap.data();
            isHost = (partyData.hostId === myPlayerId);

            await setDoc(doc(db, "parties", currentPartyCode, "players", myPlayerId), {
                name: myUsername, pfp: myPfpBase64, exp: 0, lastAnswer: "", isHost: isHost, x: 30, y: 30, lastSeen: Date.now(), ping: currentPing
            }, { merge: true });

            setupPartyListeners();
            switchScreen(partyData.status === 'active' ? 'screen-player' : 'screen-lobby');
            showToast(`Rejoined Party ${currentPartyCode}!`, "success");
        });

        // PARTY CREATION & JOINING
        function generatePartyCode() { return Math.floor(100000 + Math.random() * 900000).toString(); }

        document.getElementById('btn-mode-create').addEventListener('click', async () => {
            currentPartyCode = generatePartyCode();
            isHost = true;
            localStorage.setItem('nizzler_party_code', currentPartyCode);

            await setDoc(doc(db, "parties", currentPartyCode), {
                hostId: myPlayerId, status: 'lobby', created: Date.now(),
                question: "", optA: "", optB: ""
            });

            await setDoc(doc(db, "parties", currentPartyCode, "players", myPlayerId), {
                name: myUsername, pfp: myPfpBase64, exp: 0, lastAnswer: "", isHost: true, x: 20, y: 20, lastSeen: Date.now(), ping: currentPing
            });

            setupPartyListeners();
            switchScreen('screen-lobby');
            showToast(`Party ${currentPartyCode} Created!`, "success");
        });

        document.getElementById('btn-mode-join').addEventListener('click', async () => {
            const code = document.getElementById('join-code-input').value.trim();
            if (code.length !== 6) return showToast("Enter valid 6-digit code!", "error");

            const partySnap = await getDoc(doc(db, "parties", code));
            if (!partySnap.exists()) return showToast("Party code not found!", "error");

            currentPartyCode = code;
            isHost = false;
            localStorage.setItem('nizzler_party_code', currentPartyCode);

            await setDoc(doc(db, "parties", currentPartyCode, "players", myPlayerId), {
                name: myUsername, pfp: myPfpBase64, exp: 0, lastAnswer: "", isHost: false, x: Math.random()*150, y: Math.random()*100, lastSeen: Date.now(), ping: currentPing
            });

            setupPartyListeners();
            switchScreen('screen-lobby');
            showToast(`Joined Party ${currentPartyCode}!`, "success");
        });

        // --- REALTIME LOBBY & BAD WIFI / DISCONNECTED LOGIC ---
        function setupPartyListeners() {
            if (!currentPartyCode) return;
            document.getElementById('party-code-tag').innerText = currentPartyCode;

            if(unsubscribeParty) unsubscribeParty();
            if(unsubscribePlayers) unsubscribePlayers();

            unsubscribeParty = onSnapshot(doc(db, "parties", currentPartyCode), (snap) => {
                if (!snap.exists()) {
                    showToast("Party has been closed.", "error");
                    leaveCurrentParty();
                    return;
                }
                const data = snap.data();
                if (data.hostId === myPlayerId && !isHost) {
                    isHost = true;
                    showToast("👑 You are now the Party Host!", "warning");
                    updateDoc(doc(db, "parties", currentPartyCode, "players", myPlayerId), { isHost: true });
                }

                if (data.status === 'active') {
                    switchScreen('screen-player');
                    document.getElementById('display-q').innerText = data.question || "Round Started!";
                    document.getElementById('btn-opt-a').innerText = data.optA || "Option A";
                    document.getElementById('btn-opt-b').innerText = data.optB || "Option B";
                    
                    document.getElementById('btn-opt-a').disabled = false;
                    document.getElementById('btn-opt-b').disabled = false;
                    document.getElementById('btn-opt-a').style.opacity = '1';
                    document.getElementById('btn-opt-b').style.opacity = '1';

                    if (isHost) document.getElementById('host-game-controls').style.display = 'block';
                }
            });

            unsubscribePlayers = onSnapshot(collection(db, "parties", currentPartyCode, "players"), async (snapshot) => {
                const players = [];
                const arena = document.getElementById('floating-arena');
                arena.innerHTML = '';

                let hasActiveHost = false;
                const now = Date.now();

                snapshot.forEach(d => {
                    const p = { id: d.id, ...d.data() };
                    players.push(p);

                    // Determine if player is disconnected (last heartbeat > 10s)
                    const isDisconnected = (now - (p.lastSeen || 0)) > 10000;

                    if (p.isHost && !isDisconnected) hasActiveHost = true;

                    // BAD WIFI POPUP BROADCAST ALERT (ping > 300ms)
                    if (p.ping > 300 && !badWifiNotified[p.id]) {
                        badWifiNotified[p.id] = true;
                        showToast(`⚠️ ${p.name} has bad Wi-Fi! (${p.ping}ms)`, "warning");
                        setTimeout(() => delete badWifiNotified[p.id], 15000); // Cooldown
                    }

                    // Render Floating Profile Bubble
                    const bubble = document.createElement('div');
                    bubble.className = `profile-bubble ${isDisconnected ? 'offline' : ''}`;
                    bubble.style.left = `${p.x || 20}px`;
                    bubble.style.top = `${p.y || 20}px`;
                    
                    const avatarHtml = p.pfp 
                        ? `<img src="${p.pfp}" class="p-avatar-img">`
                        : `<div class="p-avatar-emoji">${p.isHost ? '👑' : '🎮'}</div>`;

                    bubble.innerHTML = `
                        ${avatarHtml}
                        <div class="p-name">${p.name}</div>
                        ${isDisconnected ? '<div class="status-tag">Disconnected</div>' : ''}
                    `;

                    if (isHost) makeBubbleDraggable(bubble, p.id);
                    arena.appendChild(bubble);
                });

                // HOST MIGRATION (If current host disconnected or left)
                if (!hasActiveHost && players.length > 0) {
                    const connectedPlayers = players.filter(p => (now - (p.lastSeen || 0)) <= 10000);
                    if (connectedPlayers.length > 0) {
                        const newHost = connectedPlayers[0];
                        await updateDoc(doc(db, "parties", currentPartyCode), { hostId: newHost.id });
                        await updateDoc(doc(db, "parties", currentPartyCode, "players", newHost.id), { isHost: true });
                    }
                }

                // Lobby Rules
                const startBtn = document.getElementById('btn-start-game');
                document.getElementById('lobby-count-text').innerText = `Players Joined: (${players.length} / 3 min)`;

                if (isHost) {
                    startBtn.style.display = 'block';
                    if (players.length >= 3) {
                        startBtn.disabled = false;
                        startBtn.innerText = "🚀 Start Game Anyway";
                    } else {
                        startBtn.disabled = true;
                        startBtn.innerText = `Start Game (Need ${3 - players.length} More)`;
                    }
                } else {
                    startBtn.style.display = 'none';
                }

                // Leaderboard Update
                players.sort((a, b) => b.exp - a.exp);
                document.getElementById('leaderboard-list').innerHTML = players.map((p, i) => `
                    <div class="list-item">
                        <div class="name-box">
                            ${p.pfp ? `<img src="${p.pfp}" class="list-pfp">` : ''}
                            ${i === 0 ? '👑' : i + 1 + '.'} ${p.name}
                        </div>
                        <div class="exp-tag">${p.exp} XP</div>
                    </div>
                `).join('');
            });
        }

        // LEAVE PARTY CLEANUP
        async function leaveCurrentParty() {
            if (currentPartyCode && myPlayerId) {
                try { await deleteDoc(doc(db, "parties", currentPartyCode, "players", myPlayerId)); } catch(e){}
            }
            localStorage.removeItem('nizzler_party_code');
            currentPartyCode = null; isHost = false;
            document.getElementById('btn-rejoin-party').style.display = 'none';
            switchScreen('screen-mode');
        }

        document.getElementById('btn-leave-party').addEventListener('click', () => {
            leaveCurrentParty();
            showToast("Left party room.", "info");
        });

        // DRAG BUBBLE LOGIC
        function makeBubbleDraggable(element, playerId) {
            let active = false, currentX, currentY, initialX, initialY;

            element.addEventListener('mousedown', dragStart);
            element.addEventListener('touchstart', dragStart, { passive: true });

            function dragStart(e) {
                initialX = (e.type === "touchstart") ? e.touches[0].clientX - element.offsetLeft : e.clientX - element.offsetLeft;
                initialY = (e.type === "touchstart") ? e.touches[0].clientY - element.offsetTop : e.clientY - element.offsetTop;
                active = true;
                window.addEventListener('mousemove', drag);
                window.addEventListener('touchmove', drag, { passive: true });
                window.addEventListener('mouseup', dragEnd);
                window.addEventListener('touchend', dragEnd);
            }

            function drag(e) {
                if (!active) return;
                currentX = (e.type === "touchmove") ? e.touches[0].clientX - initialX : e.clientX - initialX;
                currentY = (e.type === "touchmove") ? e.touches[0].clientY - initialY : e.clientY - initialY;
                element.style.left = `${currentX}px`;
                element.style.top = `${currentY}px`;
            }

            function dragEnd() {
                active = false;
                window.removeEventListener('mousemove', drag);
                window.removeEventListener('touchmove', drag);
                window.removeEventListener('mouseup', dragEnd);
                window.removeEventListener('touchend', dragEnd);

                updateDoc(doc(db, "parties", currentPartyCode, "players", playerId), { x: currentX, y: currentY });
            }
        }

        // GAME CONTROLS
        document.getElementById('btn-start-game').addEventListener('click', async () => {
            await updateDoc(doc(db, "parties", currentPartyCode), {
                status: 'active',
                question: 'Who is most likely to win this game?',
                optA: 'Option A', optB: 'Option B'
            });
        });

        window.submitAnswer = async function(choice) {
            document.getElementById('btn-opt-a').disabled = true;
            document.getElementById('btn-opt-b').disabled = true;
            if (choice === 'A') document.getElementById('btn-opt-b').style.opacity = '0.3';
            if (choice === 'B') document.getElementById('btn-opt-a').style.opacity = '0.3';

            await updateDoc(doc(db, "parties", currentPartyCode, "players", myPlayerId), { lastAnswer: choice });
            showToast("Answer locked!", "success");
        };

        // Navigation
        document.querySelectorAll('.nav-to-leaderboard').forEach(b => b.addEventListener('click', () => switchScreen('screen-leaderboard')));
        document.getElementById('btn-back-game').addEventListener('click', () => switchScreen('screen-player'));

        // Boot Init
        checkPersistentAuth();
    </script>
</body>
</html>
