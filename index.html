<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nizzlers Game Night - Premium Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- ADVANCED CSS & THEMING --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-glow: #00ffcc;
            --accent-secondary: #ff007f;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --success: #00e676;
            --error: #ff1744;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; user-select: none; }

        body {
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Canvas for Particle Effects */
        #fx-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; }

        /* --- CUSTOM TOAST NOTIFICATIONS --- */
        #toast-container {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; gap: 10px; z-index: 10000; pointer-events: none;
        }

        .toast {
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); border-radius: 30px;
            padding: 12px 24px; color: #fff; font-weight: 600; font-size: 0.9rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, fadeOut 0.4s ease 2.5s forwards;
        }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--error); }

        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(-20px); } }

        /* --- SCREEN ARCHITECTURE --- */
        .screen {
            display: none; flex-direction: column; align-items: center; justify-content: flex-start;
            height: 100%; width: 100%; padding: 40px 20px; overflow-y: auto;
            opacity: 0; transform: scale(0.95); transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .screen.active { display: flex; opacity: 1; transform: scale(1); }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }

        /* --- GLASSMORPHISM COMPONENTS --- */
        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 30px; width: 100%; max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); margin-bottom: 20px;
        }

        h1 { font-size: 2.5rem; font-weight: 800; text-align: center; margin-bottom: 10px; background: -webkit-linear-gradient(var(--accent-glow), #0099ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        h2 { font-size: 1.4rem; font-weight: 600; margin-bottom: 20px; text-align: center; }
        p { color: var(--text-muted); text-align: center; font-size: 0.95rem; margin-bottom: 25px; }

        /* Inputs & Buttons */
        input[type="text"] {
            width: 100%; padding: 18px; border-radius: 16px; border: 2px solid transparent;
            background: rgba(0,0,0,0.3); color: #fff; font-size: 1.1rem;
            margin-bottom: 15px; transition: all 0.3s ease; outline: none; box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        input[type="text"]:focus { border-color: var(--accent-glow); background: rgba(0,0,0,0.5); }

        button {
            width: 100%; padding: 18px; border-radius: 16px; border: none;
            background: linear-gradient(45deg, var(--accent-glow), #00b3ff);
            color: #000; font-size: 1.1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: transform 0.1s, box-shadow 0.3s;
            box-shadow: 0 10px 20px rgba(0, 255, 204, 0.2); margin-bottom: 15px;
        }
        button:active { transform: translateY(4px); box-shadow: 0 5px 10px rgba(0, 255, 204, 0.2); }
        button.secondary { background: rgba(255,255,255,0.1); color: #fff; box-shadow: none; }
        button:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; transform: none; }

        /* Game Elements */
        .timer-bar-container { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
        .timer-bar { height: 100%; background: var(--accent-glow); width: 100%; transition: width 1s linear; }

        .answer-btn { background: var(--glass-bg); border: 2px solid var(--glass-border); color: #fff; text-transform: none; font-weight: 600; }
        .answer-btn.selected { border-color: var(--accent-glow); background: rgba(0, 255, 204, 0.1); box-shadow: 0 0 15px rgba(0, 255, 204, 0.4); }
        .answer-btn.correct { border-color: var(--success); background: rgba(0, 230, 118, 0.2); }
        .answer-btn.wrong { border-color: var(--error); background: rgba(255, 23, 68, 0.2); }

        /* Template Chips for Host */
        .template-container { display: flex; overflow-x: auto; gap: 10px; margin-bottom: 15px; padding-bottom: 5px; }
        .template-chip { flex-shrink: 0; background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        .template-chip:hover { border-color: var(--accent-glow); }

        /* Leaderboard & Lobby List */
        .list-container { width: 100%; max-height: 40vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 12px; border: 1px solid var(--glass-border); }
        .list-item .name { font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .list-item .score { background: var(--accent-glow); color: #000; padding: 4px 12px; border-radius: 20px; font-weight: 800; font-size: 0.9rem; }
        .list-item.rank-1 { border-color: #ffd700; background: rgba(255, 215, 0, 0.1); }
        
        .loader { border: 4px solid var(--glass-border); border-top: 4px solid var(--accent-glow); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- FX Layer -->
    <canvas id="fx-canvas"></canvas>
    
    <!-- Custom Notifications -->
    <div id="toast-container"></div>

    <!-- 1. Loading Screen -->
    <div id="screen-loading" class="screen active">
        <div class="loader" style="margin-top: 40vh;"></div>
        <h2 style="margin-top: 20px; color: var(--accent-glow);">Initializing Engine</h2>
    </div>

    <!-- 2. Login Screen -->
    <div id="screen-login" class="screen">
        <div class="glass-panel">
            <h1>Nizzlers</h1>
            <p>Game Night: Premium Edition</p>
            <input type="text" id="username" placeholder="e.g., Lilo, Lana, Juliana, Rosa..." autocomplete="off">
            <button id="btn-join">Enter Lobby</button>
        </div>
    </div>

    <!-- 3. Lobby Screen -->
    <div id="screen-lobby" class="screen">
        <div class="glass-panel" style="max-height: 80vh; display: flex; flex-direction: column;">
            <h2>Waiting Room</h2>
            <p id="lobby-status">Waiting for Host to start the game...</p>
            <div class="list-container" id="lobby-list" style="flex-grow: 1;">
                <!-- Populated via JS -->
            </div>
            <button id="btn-start-game" style="display: none; margin-top: 20px;">Start Game Night</button>
        </div>
    </div>

    <!-- 4. Host Dashboard -->
    <div id="screen-host" class="screen">
        <div class="glass-panel" style="max-width: 500px;">
            <h2>Control Panel</h2>
            <p>Select a template or write your own.</p>
            
            <div class="template-container">
                <div class="template-chip" onclick="fillTemplate('What is Georges\'s favorite food?', 'Pizza', 'Sushi', 'A')">Georges's Food</div>
                <div class="template-chip" onclick="fillTemplate('Who is most likely to rage quit Fortnite first?', 'Joe', 'Sue', 'B')">Fortnite Rage</div>
                <div class="template-chip" onclick="fillTemplate('What happened on December 24, 1994?', 'Owen was born', 'The group met', 'A')">Dec 24</div>
                <div class="template-chip" onclick="fillTemplate('Who would survive a zombie apocalypse?', 'Juliana', 'Lana', 'A')">Zombies</div>
            </div>

            <input type="text" id="host-q" placeholder="Enter Question...">
            <input type="text" id="host-opt-a" placeholder="Option A Text">
            <input type="text" id="host-opt-b" placeholder="Option B Text">
            
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button id="host-set-a" class="secondary" style="margin: 0; border: 2px solid var(--success);">Answer: A</button>
                <button id="host-set-b" class="secondary" style="margin: 0;">Answer: B</button>
            </div>
            
            <button id="btn-push-q">Deploy Question</button>
            <button id="btn-end-round" class="secondary" style="border: 1px solid var(--error); color: var(--error);">End Round & Reveal</button>
        </div>
        <button class="secondary nav-to-leaderboard" style="max-width: 500px;">Show Leaderboard</button>
    </div>

    <!-- 5. Player Screen -->
    <div id="screen-player" class="screen">
        <div class="glass-panel">
            <div class="timer-bar-container"><div class="timer-bar" id="player-timer"></div></div>
            <h2 id="display-q" style="min-height: 60px; display: flex; align-items: center; justify-content: center;">Waiting for next round...</h2>
        </div>
        <div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px;">
            <button id="btn-opt-a" class="answer-btn" onclick="submitAnswer('A')" disabled>Option A</button>
            <button id="btn-opt-b" class="answer-btn" onclick="submitAnswer('B')" disabled>Option B</button>
        </div>
        <button class="secondary nav-to-leaderboard" style="max-width: 400px; margin-top: 30px;">View Rankings</button>
    </div>

    <!-- 6. Leaderboard Screen -->
    <div id="screen-leaderboard" class="screen">
        <div class="glass-panel" style="max-height: 80vh; display: flex; flex-direction: column;">
            <h1>Rankings</h1>
            <div class="list-container" id="leaderboard-list" style="flex-grow: 1;">
                <!-- Populated via JS -->
            </div>
            <button id="btn-back-game" style="margin-top: 20px;">Return to Game</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, getDoc, collection, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCoxu99FykhoDnyZiVkPaSS2cC03KmG9b0",
            authDomain: "nizzlers-92be3.firebaseapp.com",
            projectId: "nizzlers-92be3",
            storageBucket: "nizzlers-92be3.firebasestorage.app",
            messagingSenderId: "594175328017",
            appId: "1:594175328017:web:b9b92535f3d752961756b0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // State Variables
        let myPlayerId = localStorage.getItem('nizzler_id');
        let myUsername = localStorage.getItem('nizzler_name');
        let isHost = false;
        let selectedHostAnswer = 'A';
        let currentRoundStatus = 'waiting';

        // ==========================================
        // UTILITY: SOUND ENGINE (Web Audio API)
        // ==========================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'select') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'success') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'error') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // ==========================================
        // UTILITY: UI & TOAST ENGINE
        // ==========================================
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            setTimeout(() => document.getElementById(screenId).classList.add('active'), 50);
        }

        window.showToast = function(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        };

        // ==========================================
        // UTILITY: PARTICLE ENGINE (Confetti)
        // ==========================================
        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function fireConfetti() {
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: canvas.width / 2, y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 1) * 20,
                    size: Math.random() * 8 + 4,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    life: 1
                });
            }
        }

        function animateFX() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx; p.y += p.vy; p.vy += 0.5; // gravity
                p.life -= 0.01;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillRect(p.x, p.y, p.size, p.size);
                if (p.life <= 0) particles.splice(index, 1);
            });
            ctx.globalAlpha = 1;
            requestAnimationFrame(animateFX);
        }
        animateFX();

        // ==========================================
        // CORE LOGIC: INITIALIZATION
        // ==========================================
        async function bootApp() {
            if (myPlayerId && myUsername) {
                const snap = await getDoc(doc(db, "players", myPlayerId));
                if (snap.exists()) {
                    isHost = myUsername.toLowerCase() === 'owen';
                    showToast(`Welcome back, ${myUsername}!`, 'success');
                    setupListeners();
                    switchScreen('screen-lobby');
                } else {
                    localStorage.clear(); myPlayerId = null; switchScreen('screen-login');
                }
            } else {
                switchScreen('screen-login');
            }
        }

        document.getElementById('btn-join').addEventListener('click', async () => {
            playSound('select');
            const name = document.getElementById('username').value.trim();
            if (!name) return showToast("Enter your name to join!", "error");

            myUsername = name;
            myPlayerId = 'usr_' + Date.now().toString(36) + Math.random().toString(36).substring(2);
            isHost = myUsername.toLowerCase() === 'owen';

            localStorage.setItem('nizzler_id', myPlayerId);
            localStorage.setItem('nizzler_name', myUsername);

            await setDoc(doc(db, "players", myPlayerId), {
                name: myUsername, exp: 0, lastAnswer: "", isHost: isHost, joinedAt: Date.now()
            });

            setupListeners();
            switchScreen('screen-lobby');
            showToast("Connected to Lobby!", "success");
        });

        // ==========================================
        // CORE LOGIC: LISTENERS (Real-time Sync)
        // ==========================================
        function setupListeners() {
            // Listen to Players (Lobby & Leaderboard)
            onSnapshot(collection(db, "players"), (snapshot) => {
                const players = [];
                snapshot.forEach(doc => { if (!doc.data().isHost) players.push(doc.data()); });
                
                // Update Lobby
                const lobbyList = document.getElementById('lobby-list');
                lobbyList.innerHTML = players.map(p => `<div class="list-item"><div class="name">🎮 ${p.name}</div></div>`).join('');
                
                // Update Leaderboard
                players.sort((a, b) => b.exp - a.exp);
                const leadList = document.getElementById('leaderboard-list');
                leadList.innerHTML = players.map((p, i) => `
                    <div class="list-item ${i===0 ? 'rank-1' : ''}">
                        <div class="name">${i===0 ? '👑' : i+1+'.'} ${p.name}</div>
                        <div class="score">${p.exp} XP</div>
                    </div>
                `).join('');
            });

            // Listen to Game State
            onSnapshot(doc(db, "game", "state"), (docSnap) => {
                if (!docSnap.exists()) return;
                const data = docSnap.data();
                currentRoundStatus = data.status;
                
                // Lobby logic
                if (data.status === 'lobby') {
                    if (isHost) document.getElementById('btn-start-game').style.display = 'block';
                    document.getElementById('lobby-status').innerText = "Waiting for Host to start...";
                } else if (data.status === 'active') {
                    switchScreen(isHost ? 'screen-host' : 'screen-player');
                    document.getElementById('display-q').innerText = data.question;
                    document.getElementById('btn-opt-a').innerText = data.optA;
                    document.getElementById('btn-opt-b').innerText = data.optB;
                    
                    // Reset UI for players
                    if (!isHost) {
                        const aBtn = document.getElementById('btn-opt-a');
                        const bBtn = document.getElementById('btn-opt-b');
                        aBtn.disabled = false; bBtn.disabled = false;
                        aBtn.className = 'answer-btn'; bBtn.className = 'answer-btn';
                        document.getElementById('player-timer').style.width = '100%';
                        showToast("New Question!", "info");
                        playSound('select');
                    }
                } else if (data.status === 'revealed') {
                    if (!isHost) {
                        document.getElementById('btn-opt-a').disabled = true;
                        document.getElementById('btn-opt-b').disabled = true;
                        const correctBtn = document.getElementById(data.correct === 'A' ? 'btn-opt-a' : 'btn-opt-b');
                        correctBtn.classList.add('correct');
                        
                        // Check if I won
                        getDoc(doc(db, "players", myPlayerId)).then(mySnap => {
                            if (mySnap.data().lastAnswer === data.correct) {
                                fireConfetti(); playSound('success'); showToast("+100 XP!", "success");
                            } else {
                                playSound('error'); showToast("Incorrect!", "error");
                            }
                        });
                    }
                }
            });
        }

        // ==========================================
        // HOST CONTROLS
        // ==========================================
        document.getElementById('btn-start-game').addEventListener('click', async () => {
            playSound('select');
            await setDoc(doc(db, "game", "state"), { status: 'prep' });
            switchScreen('screen-host');
        });

        // Template logic
        window.fillTemplate = function(q, a, b, ans) {
            document.getElementById('host-q').value = q;
            document.getElementById('host-opt-a').value = a;
            document.getElementById('host-opt-b').value = b;
            setHostAnswer(ans);
            playSound('select');
        };

        function setHostAnswer(ans) {
            selectedHostAnswer = ans;
            document.getElementById('host-set-a').style.border = ans === 'A' ? '2px solid var(--success)' : 'none';
            document.getElementById('host-set-b').style.border = ans === 'B' ? '2px solid var(--success)' : 'none';
        }
        document.getElementById('host-set-a').addEventListener('click', () => setHostAnswer('A'));
        document.getElementById('host-set-b').addEventListener('click', () => setHostAnswer('B'));

        document.getElementById('btn-push-q').addEventListener('click', async () => {
            const q = document.getElementById('host-q').value.trim();
            const a = document.getElementById('host-opt-a').value.trim();
            const b = document.getElementById('host-opt-b').value.trim();
            if(!q || !a || !b) return showToast("Fill all fields!", "error");

            playSound('select');
            const batch = writeBatch(db);
            const pSnap = await getDocs(collection(db, "players"));
            pSnap.forEach(d => batch.update(d.ref, { lastAnswer: "" }));
            
            batch.set(doc(db, "game", "state"), { question: q, optA: a, optB: b, correct: selectedHostAnswer, status: 'active' });
            await batch.commit();
            showToast("Question Deployed", "success");
        });

        document.getElementById('btn-end-round').addEventListener('click', async () => {
            playSound('select');
            const stateSnap = await getDoc(doc(db, "game", "state"));
            const correctAns = stateSnap.data().correct;

            const batch = writeBatch(db);
            const pSnap = await getDocs(collection(db, "players"));
            
            pSnap.forEach(d => {
                const data = d.data();
                if (!data.isHost && data.lastAnswer === correctAns) {
                    batch.update(d.ref, { exp: data.exp + 100 });
                }
            });

            batch.update(doc(db, "game", "state"), { status: 'revealed' });
            await batch.commit();
            showToast("Round Ended", "info");
        });

        // ==========================================
        // PLAYER CONTROLS
        // ==========================================
        window.submitAnswer = async function(choice) {
            playSound('select');
            document.getElementById('btn-opt-a').disabled = true;
            document.getElementById('btn-opt-b').disabled = true;
            
            const btn = document.getElementById(`btn-opt-${choice.toLowerCase()}`);
            btn.classList.add('selected');

            await updateDoc(doc(db, "players", myPlayerId), { lastAnswer: choice });
            showToast("Answer Locked!", "success");
        };

        // Navigation
        document.querySelectorAll('.nav-to-leaderboard').forEach(btn => {
            btn.addEventListener('click', () => { playSound('select'); switchScreen('screen-leaderboard'); });
        });
        document.getElementById('btn-back-game').addEventListener('click', () => {
            playSound('select'); switchScreen(isHost ? 'screen-host' : 'screen-player');
        });

        // Start Boot Sequence
        setTimeout(bootApp, 1000);

    </script>
</body>
</html>
